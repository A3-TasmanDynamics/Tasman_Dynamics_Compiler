# .github/workflows/compile.yml
name: Tasman Dynamics Compiler

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'compiler/configs/**.json' # Only run if a JSON config was added or modified
  push:
    branches: [ main ]

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # Check out the PR branch to commit back to it
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        working-directory: ./compiler
        run: npm install
        
      - name: Run TypeScript Compiler
        working-directory: ./compiler
        run: npm run build
        
      - name: Check for Generated Changes
        id: verify_diff
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_ENV
          
      - name: Commit Autogenerated Files
        if: env.changed == 'true'
        run: |
          git config --global user.name "TasDyn-Bot"
          git config --global user.email "actions@github.com"
          git add addons/tasdyn_compat/autogen_interactions.sqf
          git add addons/tasdyn_compat/autogen_vehicles.cpp
          git commit -m "chore: auto-compile JSON to SQF/CPP [skip ci]"
          git push